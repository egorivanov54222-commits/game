const Sound = {
  ctx: null,
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  },
  beep(freq, dur, type='sine', vol=0.08) {
    if (!this.ctx || this.ctx.state === 'suspended') return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + dur);
  },
  sweep(f1, f2, dur, type='sawtooth', vol=0.12) {
    if (!this.ctx || this.ctx.state === 'suspended') return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f1, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(f2, this.ctx.currentTime + dur);
    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + dur);
  },
  hit()      { this.beep(180 + Math.random()*60, 0.05, 'square', 0.04); },
  hitHeavy() { this.sweep(120, 40, 0.25, 'sawtooth', 0.15); },
  die()      { this.sweep(280, 70, 0.28, 'sawtooth', 0.08); },
  cannon()   { this.sweep(90, 20, 0.7, 'sawtooth', 0.3); this.sweep(60, 15, 0.9, 'square', 0.15); },
  buff()     { this.beep(600, 0.08, 'triangle', 0.1); setTimeout(() => this.beep(900, 0.14, 'triangle', 0.1), 90); },

function recalcBuffs() {
  const m = { dmg:1, hp:1, towerDmg:1, regen:1, cannon:1, vamp:false, crit:0, speed:1 };
  for (const b of G.buffs) {
    if (b.id === 'dmg') m.dmg += 0.15;
    else if (b.id === 'hp') m.hp += 0.20;
    else if (b.id === 'towerDmg') m.towerDmg += 0.30;
    else if (b.id === 'regen') m.regen += 0.25;
    else if (b.id === 'cannon') m.cannon += 0.20;
    else if (b.id === 'vamp') m.vamp = true;
    else if (b.id === 'crit') m.crit += 0.08;
    else if (b.id === 'speed') m.speed += 0.12;
  }
  G.buffMults = m;
}

    G.coins = data.coins || 0;
    G.level = Math.max(1, data.level || 1);
    G.era = Math.min(3, Math.floor((G.level - 1) / 2));
    if (Array.isArray(data.unitLevels)) G.unitLevels = data.unitLevels;
    if (data.meta) G.meta = { ...G.meta, ...data.meta };
  }
}

/* ===================== УТИЛИТЫ ===================== */
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function darken(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, ((n >> 16) & 0xff) - amt), g = Math.max(0, ((n >> 8) & 0xff) - amt), b = Math.max(0, (n & 0xff) - amt);
  return `rgb(${r},${g},${b})`;
}

/* ===================== СПАВН ===================== */
function spawnUnit(team, eraIdx, unitIdx, isBoss = false) {
  const def = ERAS[eraIdx].units[unitIdx];
  const enemyLevelMult = team === 'e' ? Math.pow(1.3, G.level - 1) : 1;
  const lvlBonus = team === 'p' ? (1 + (G.unitLevels[unitIdx] - 1) * 0.25) : 1;
  const metaDmg = team === 'p' ? getMetaMult('unitDmg') : 1;
  const metaHp  = team === 'p' ? getMetaMult('unitHp')  : 1;
  
  let hp = def.hp * enemyLevelMult * lvlBonus * metaHp;
  let dmg = def.dmg * enemyLevelMult * lvlBonus * metaDmg;
  let size = def.size; let color = def.color; let name = def.name;

  if (isBoss) { hp *= 8; dmg *= 3; size *= 1.9; color = '#ff0055'; name = 'БОСС'; }

  const u = {
    team, era: eraIdx, type: unitIdx,
    x: team === 'p' ? 118 : W - 118,
    yOff: (Math.random() - 0.5) * 22,
    hp, maxHp: hp, dmg,
    speed: def.speed * (team === 'p' ? G.buffMults.speed : 1),
    range: def.range, color, size,
    atkCd: 0, atkSpeed: 0.8, anim: Math.random() * 6.28, attackAnim: 0,
    isBoss, name, flashTimer: 0,
  };
  G.units.push(u);
  if (isBoss) {
    G.bossUnit = u;
    G.bossAnnounce = 2.5;
    bossBar.classList.add('show');
    Sound.boss();
  }
}

function trySpawn(i) {
  if (!G.running) return;
  Sound.init();
  const def = ERAS[G.era].units[i];
  if (G.meat < def.cost) return;
  G.meat -= def.cost;
  spawnUnit('p', G.era, i);
  Sound.click();
}

function buildTower() {
  if (!G.running || G.coins < G.towerPrice) return;
  if (G.towers.filter(t => t.team === 'p').length >= 3) return;
  G.coins -= G.towerPrice;
  G.towerPrice += 30;
  G.towers.push({ team: 'p', x: G.playerBaseX + 100 + Math.random() * 100, y: GROUND, range: 180, dmg: 15 + G.era * 8, atkCd: 0, atkSpeed: 0.6 });
  Sound.click();
}

function upgradeUnits() {
  if (!G.running || G.coins < G.upgradePrice) return;
  G.coins -= G.upgradePrice;
  for (let i = 0; i < 4; i++) G.unitLevels[i]++;
  G.upgradePrice += 50;
  Sound.buff();
  saveProgress();
  buildButtons();
}

function chargeCannon(amt) {
  if (!G.running) return;
  G.cannonCharge = Math.min(G.cannonMax, G.cannonCharge + amt * G.buffMults.cannon);
}

function fireCannon() {
  if (!G.running || G.cannonCharge < G.cannonMax) return;
  Sound.init();
  G.cannonCharge = 0;
  G.shakeIntensity = 22;
  G.flash = 0.7;
  G.hitstop = 0.12;
  Sound.cannon();
  
  const dmg = (300 + G.level * 100) * (1 + G.meta.cannonDmg * 0.5);
  
  for (const u of G.units) {
    if (u.team === 'e') {
      u.hp -= dmg; u.flashTimer = 0.2;
      addFloat(u.x, GROUND + u.yOff - 70, '-' + Math.round(dmg), '#fbbf24', 22);
      addHit(u.x, GROUND + u.yOff - 30, '#fbbf24', 8);
    }
  }
  G.enemyBaseHp -= dmg * 0.4;
  addFloat(G.enemyBaseX, GROUND - 100, '-' + Math.round(dmg * 0.4), '#fbbf24', 20);
  
  for (let i = 0; i < 80; i++) {
    G.particles.push({
      x: G.enemyBaseX + (Math.random() - 0.5) * 250, y: GROUND - 100 + (Math.random() - 0.5) * 200,
      vx: (Math.random() - 0.5) * 500, vy: (Math.random() - 0.5) * 500,
      life: 1, maxLife: 1, color: i % 3 ? '#fbbf24' : '#f97316', size: 2 + Math.random() * 6
    });
  }
}

/* ===================== ВОЛНЫ ===================== */
function startWave() {
  G.wave++;
  if (G.wave > G.maxWaveReached) {
    G.maxWaveReached = G.wave;
    saveProgress(); // Сохраняем рекорд волны
  }
  G.bossUnit = null;
  bossBar.classList.remove('show');
  if (G.wave % 3 === 0) { G.enemiesToSpawn = 1; G.wavePending = false; } 
  else { G.enemiesToSpawn = 3 + Math.floor(G.wave * 1.2) + Math.min(6, G.level - 1); G.wavePending = false; }
}

function showBuffSelection() {
  G.running = false;
  Sound.buff();
  const choices = [...BUFFS].sort(() => 0.5 - Math.random()).slice(0, 3);
  let html = `<h1>Волна ${G.wave} пройдена!</h1><p>+${30 + G.wave * 10} 💰 · Выбери усиление:</p><div style="display:flex;flex-wrap:wrap;justify-content:center">`;
  choices.forEach(b => { html += `<div class="buff-card" data-buff="${b.id}"><h3>${b.icon} ${b.name}</h3><p>${b.desc}</p></div>`; });
  html += `</div>`;
  G.coins += 30 + G.wave * 10;
  showOverlay(html, 'buff');
}

/* ===================== ЛОГИКА ЮНИТОВ ===================== */
function updateUnit(u, dt) {
  if (u.flashTimer > 0) u.flashTimer -= dt;
  u.atkCd -= dt;
  u.attackAnim = Math.max(0, u.attackAnim - dt * 3.5);
  const dir = u.team === 'p' ? 1 : -1;

  let target = null, best = Infinity;
  for (const o of G.units) {
    if (o.team === u.team || o.hp <= 0) continue;
    if ((o.x - u.x) * dir < -25) continue;
    const d = Math.abs(o.x - u.x);
    if (d < best) { best = d; target = o; }
  }

  if (target && best <= u.range) {
    if (u.atkCd <= 0) {
      u.atkCd = u.atkSpeed; u.attackAnim = 1;
      let finalDmg = u.dmg * G.buffMults.dmg;
      const isCrit = u.team === 'p' && Math.random() < G.buffMults.crit;
      if (isCrit) finalDmg *= 2;
      
      target.hp -= finalDmg;
      target.flashTimer = 0.15;
      addFloat(target.x, GROUND + target.yOff - 62, '-' + Math.round(finalDmg), isCrit ? '#fde047' : (u.team === 'p' ? '#4ade80' : '#f87171'), isCrit ? 20 : 15);
      addHit(target.x + (Math.random() - 0.5) * 10, GROUND + target.yOff - 30, u.team === 'p' ? '#4ade80' : '#f87171', isCrit ? 8 : 4);
      
      if (Math.random() < 0.4) Sound.hit();
      if (u.team === 'p') {
        chargeCannon(isCrit ? 3 : 1);
        if (G.buffMults.vamp) u.hp = Math.min(u.maxHp, u.hp + finalDmg * 0.1);
      }
      if (target.hp <= 0) {
        if (u.team === 'p') {
          G.coins += 2; G.comboCount++; G.comboTimer = 1.5; chargeCannon(2); Sound.die();
          for (let i = 0; i < 12; i++) {
            G.particles.push({ x: target.x, y: GROUND + target.yOff - 25, vx: (Math.random() - 0.5) * 200, vy: -Math.random() * 200 - 50, life: 0.6, maxLife: 0.6, color: target.team === 'p' ? '#4ade80' : '#f87171', size: 2 + Math.random() * 3 });
          }
        }
      }
    }
    return;
  }

  const baseX = u.team === 'p' ? G.enemyBaseX : G.playerBaseX;
  if (Math.abs(baseX - u.x) <= u.range + 8) {
    if (u.atkCd <= 0) {
      u.atkCd = u.atkSpeed; u.attackAnim = 1;
      let finalDmg = u.dmg * G.buffMults.dmg;
      if (u.team === 'p') { G.enemyBaseHp -= finalDmg; if (Math.random() < 0.3) Sound.hitHeavy(); }
      else { G.playerBaseHp -= finalDmg; G.shakeIntensity = Math.max(G.shakeIntensity, 4); }
      addFloat(baseX, GROUND - 96, '-' + Math.round(finalDmg), u.team === 'p' ? '#4ade80' : '#f87171', 16);
    }
    return;
  }

  u.x += dir * u.speed * dt;
  u.anim += dt * 9;
  u.x = Math.max(40, Math.min(W - 40, u.x));
}

function updateTowers(dt) {
  for (const t of G.towers) {
    t.atkCd -= dt;
    if (t.atkCd > 0) continue;
    let target = null, best = Infinity;
    for (const u of G.units) {
      if (u.team === t.team || u.hp <= 0) continue;
      const d = Math.abs(u.x - t.x);
      if (d < t.range && d < best) { best = d; target = u; }
    }
    if (target) {
      t.atkCd = t.atkSpeed;
      let finalDmg = t.dmg * G.buffMults.towerDmg;
      target.hp -= finalDmg; target.flashTimer = 0.1;
      addFloat(target.x, GROUND + target.yOff - 60, '-' + Math.round(finalDmg), '#60a5fa', 13);
      G.particles.push({ x: t.x, y: t.y - 80, vx: (target.x - t.x) * 2, vy: (GROUND - 30 - (t.y - 80)) * 2, life: 0.3, maxLife: 0.3, color: '#60a5fa', size: 2 });
    }
  }
}

function separate() {
  for (let i = 0; i < G.units.length; i++) {
    for (let j = i + 1; j < G.units.length; j++) {
      const a = G.units[i], b = G.units[j];
      if (a.team !== b.team) continue;
      const dx = b.x - a.x;
      if (Math.abs(dx) < 22) {
        const push = (22 - Math.abs(dx)) * 0.05 * (dx >= 0 ? 1 : -1);
        a.x -= push; b.x += push;
      }
    }
  }
}

function addFloat(x, y, text, color, size = 15) { G.floats.push({ x, y, text, color, size, life: 1, maxLife: 1 }); }
function addHit(x, y, color, count = 5) {
  for (let i = 0; i < count; i++) {
    G.particles.push({ x, y, vx: (Math.random() - 0.5) * 180, vy: -Math.random() * 180 - 20, life: 0.5, maxLife: 0.5, color, size: 1.5 + Math.random() * 2.5 });
  }
}
function updateFloats(dt) {
  for (const f of G.floats) { f.y -= 50 * dt; f.life -= dt * 1.3; }
  G.floats = G.floats.filter(f => f.life > 0);
  for (const p of G.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt; }
  G.particles = G.particles.filter(p => p.life > 0);
}

function checkWaveComplete() {
  if (G.enemiesToSpawn > 0) return false;
  const enemiesAlive = G.units.some(u => u.team === 'e' && u.hp > 0);
  if (enemiesAlive) return false;
  if (G.wavePending) return false;
  G.wavePending = true;
  setTimeout(() => { if (G.running) { G.wavePending = false; showBuffSelection(); } }, 600);
  return true;
}

function enemyAI(dt) {
  if (checkWaveComplete()) return;
  if (G.enemiesToSpawn <= 0) return;
  G.aiTimer -= dt;
  if (G.aiTimer > 0) return;
  G.aiTimer = Math.max(0.4, 0.9 - G.level * 0.03) + Math.random() * 0.5;

  if (G.wave % 3 === 0 && !G.bossUnit && G.enemiesToSpawn === 1) {
    spawnUnit('e', G.era, 1, true); G.enemiesToSpawn--; return;
  }
  let roll = Math.random(); let unitIdx;
  if (G.level >= 3 && roll < 0.15) unitIdx = 3; else if (roll < 0.35) unitIdx = 2; else if (roll < 0.65) unitIdx = 1; else unitIdx = 0;
  spawnUnit('e', G.era, unitIdx);
  G.enemiesToSpawn--;
}

function update(dt) {
  if (G.hitstop > 0) { G.hitstop -= dt; dt *= 0.15; }
  if (G.comboTimer > 0) { G.comboTimer -= dt; if (G.comboTimer <= 0) G.comboCount = 0; }
  if (G.shakeIntensity > 0) G.shakeIntensity = Math.max(0, G.shakeIntensity - dt * 40);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 3);
  if (G.bossAnnounce > 0) G.bossAnnounce -= dt;
  
  G.meat = Math.min(G.meatMax, G.meat + G.meatRegen * G.buffMults.regen * dt);
  enemyAI(dt);
  for (const u of G.units) if (u.hp > 0) updateUnit(u, dt);
  updateTowers(dt);
  separate();
  G.units = G.units.filter(u => u.hp > 0);
  updateFloats(dt);
  
  if (G.bossUnit && G.bossUnit.hp > 0) bossBarFill.style.width = (G.bossUnit.hp / G.bossUnit.maxHp * 100) + '%';
  else if (G.bossUnit) { bossBar.classList.remove('show'); G.bossUnit = null; }
  
  if (G.enemyBaseHp <= 0)  { G.enemyBaseHp = 0;  endBattle(true);  return; }
  if (G.playerBaseHp <= 0) { G.playerBaseHp = 0; endBattle(false); return; }
}

/* ===================== ФОН ===================== */
function drawCloud(x, y, r) {
  ctx.beginPath(); ctx.arc(x, y, r * 0.6, 0, Math.PI * 2); ctx.arc(x + r * 0.55, y - r * 0.15, r * 0.5, 0, Math.PI * 2);
  ctx.arc(x - r * 0.55, y + r * 0.1, r * 0.4, 0, Math.PI * 2); ctx.arc(x + r * 0.15, y + r * 0.22, r * 0.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawBackground() {
  const era = ERAS[G.era];
  const t = performance.now() / 1000;
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, era.sky[0]); sky.addColorStop(1, era.sky[1]);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, GROUND);

  const sunX = W * 0.72 + Math.sin(t * 0.05) * 30, sunY = 78;
  const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 90);
  sunGrad.addColorStop(0, G.era === 3 ? 'rgba(200,150,255,.7)' : 'rgba(255,210,140,.75)');
  sunGrad.addColorStop(1, 'rgba(255,200,100,0)');
  ctx.fillStyle = sunGrad; ctx.fillRect(0, 0, W, GROUND);
  ctx.fillStyle = G.era === 3 ? '#e0c4ff' : '#fff4c2';
  ctx.beginPath(); ctx.arc(sunX, sunY, 26, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = G.era === 0 ? 'rgba(50,30,20,.85)' : G.era === 1 ? 'rgba(25,55,35,.85)' : G.era === 2 ? 'rgba(35,30,45,.85)' : 'rgba(15,20,30,.95)';
  ctx.beginPath(); ctx.moveTo(0, GROUND);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, GROUND - 70 - Math.sin(x * 0.008 + G.era) * 40 - Math.sin(x * 0.03) * 14);
  ctx.lineTo(W, GROUND); ctx.closePath(); ctx.fill();

  ctx.fillStyle = G.era === 3 ? 'rgba(120,160,220,.14)' : 'rgba(255,255,255,.22)';
  for (let i = 0; i < 4; i++) drawCloud(((t * 12 + i * 260) % (W + 260)) - 130, 60 + i * 32 + Math.sin(t * 0.3 + i) * 8, 38 + i * 8);

  ctx.fillStyle = era.ground; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(0, GROUND, W, 3);
  ctx.fillStyle = G.era === 0 ? 'rgba(0,0,0,.18)' : G.era === 1 ? 'rgba(0,90,40,.25)' : G.era === 2 ? 'rgba(120,120,140,.25)' : 'rgba(50,90,140,.35)';
  for (let i = 0; i < 50; i++) {
    ctx.beginPath(); ctx.arc((i * 173) % W, GROUND + 18 + ((i * 47) % (H - GROUND - 36)), 1 + (i % 3) * 0.8, 0, Math.PI * 2); ctx.fill();
  }
}

/* ===================== БАЗЫ ===================== */
function drawBase(x, hp, max, team) {
  const ratio = Math.max(0, hp / max);
  const color = team === 'p' ? '#4ade80' : '#f87171';
  const w = 78, h = 145;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(x, GROUND + 3, w * 0.65, 6, 0, 0, Math.PI * 2); ctx.fill();

  if (G.era === 0) drawBaseStone(x, w, h, color);
  else if (G.era === 1) drawBaseAncient(x, w, h, color);
  else if (G.era === 2) drawBaseMedieval(x, w, h, color);
  else drawBaseFuture(x, w, h, color);

  if (ratio < 0.7) drawCracks(x, w, h, 1 - ratio);

  const bw = 80, by = GROUND - h - 34;
  ctx.fillStyle = 'rgba(0,0,0,.7)'; roundRect(x - bw/2 - 2, by - 2, bw + 4, 14, 4); ctx.fill();
  ctx.fillStyle = color; ctx.fillRect(x - bw/2, by, bw * ratio, 10);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1; ctx.strokeRect(x - bw/2, by, bw, 10);
}

function drawBaseStone(x, w, h, color) {
  ctx.fillStyle = '#5d3a12'; ctx.beginPath(); ctx.moveTo(x - w/2, GROUND); ctx.lineTo(x, GROUND - h); ctx.lineTo(x + w/2, GROUND); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.5;
  for (let i = 1; i < 5; i++) { ctx.beginPath(); ctx.moveTo(x - w/2 + i * (w/5), GROUND); ctx.lineTo(x, GROUND - h + 6); ctx.stroke(); }
  ctx.fillStyle = '#1a1005'; ctx.beginPath(); ctx.arc(x, GROUND - 4, 15, Math.PI, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - w/2, GROUND); ctx.lineTo(x, GROUND - h); ctx.lineTo(x + w/2, GROUND); ctx.stroke();
  ctx.strokeStyle = '#3a2410'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x, GROUND - h); ctx.lineTo(x, GROUND - h - 26); ctx.stroke();
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x, GROUND - h - 26); ctx.lineTo(x + 18, GROUND - h - 20); ctx.lineTo(x, GROUND - h - 14); ctx.closePath(); ctx.fill();
}
function drawBaseAncient(x, w, h, color) {
  ctx.fillStyle = '#78716c'; ctx.fillRect(x - w/2 - 8, GROUND - 6, w + 16, 6); ctx.fillRect(x - w/2 - 4, GROUND - 12, w + 8, 6);
  const cw = 20; ctx.fillStyle = '#d6d3d1'; ctx.fillRect(x - cw/2, GROUND - h + 20, cw, h - 32);
  ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(x - cw/2 + i * (cw/4), GROUND - h + 24); ctx.lineTo(x - cw/2 + i * (cw/4), GROUND - 16); ctx.stroke(); }
  ctx.fillStyle = '#a8a29e'; ctx.fillRect(x - cw/2 - 4, GROUND - h + 14, cw + 8, 8);
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x - w/2, GROUND - h + 14); ctx.lineTo(x, GROUND - h - 18); ctx.lineTo(x + w/2, GROUND - h + 14); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2; ctx.stroke();
}
function drawBaseMedieval(x, w, h, color) {
  const grad = ctx.createLinearGradient(x - w/2, 0, x + w/2, 0);
  grad.addColorStop(0, '#4b5563'); grad.addColorStop(0.5, '#94a3b8'); grad.addColorStop(1, '#4b5563');
  ctx.fillStyle = grad; ctx.fillRect(x - w/2, GROUND - h + 20, w, h - 20);
  ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 1;
  for (let yy = GROUND - h + 30; yy < GROUND; yy += 14) { ctx.beginPath(); ctx.moveTo(x - w/2, yy); ctx.lineTo(x + w/2, yy); ctx.stroke(); }
  const bw = w / 5;
  for (let i = 0; i < 5; i++) { ctx.fillStyle = '#94a3b8'; ctx.fillRect(x - w/2 + i * bw, GROUND - h + (i % 2 ? 5 : 0), bw - 2, 20); }
  ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.moveTo(x - 16, GROUND); ctx.lineTo(x - 16, GROUND - 38); ctx.quadraticCurveTo(x, GROUND - 54, x + 16, GROUND - 38); ctx.lineTo(x + 16, GROUND); ctx.closePath(); ctx.fill();
  ctx.fillStyle = color; ctx.fillRect(x - 6, GROUND - h + 56, 12, 14);
  ctx.strokeStyle = '#475569'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x, GROUND - h); ctx.lineTo(x, GROUND - h - 24); ctx.stroke();
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x, GROUND - h - 24); ctx.lineTo(x + 22, GROUND - h - 18); ctx.lineTo(x, GROUND - h - 8); ctx.closePath(); ctx.fill();
}
function drawBaseFuture(x, w, h, color) {
  const glow = 0.55 + 0.45 * Math.sin(performance.now() / 400);
  const grad = ctx.createLinearGradient(x, GROUND - h, x, GROUND);
  grad.addColorStop(0, '#334155'); grad.addColorStop(1, '#0f172a');
  ctx.fillStyle = grad; ctx.fillRect(x - w/2, GROUND - h, w, h);
  ctx.fillStyle = `rgba(34,211,238,${glow})`;
  for (let i = 0; i < 4; i++) ctx.fillRect(x - w/2 + 8, GROUND - h + 28 + i * 22, w - 16, 3);
  ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(x, GROUND - h + 8, w * 0.55, Math.PI, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(34,211,238,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, GROUND - h + 8, w * 0.55, Math.PI, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#000'; roundRect(x - 12, GROUND - 44, 24, 44, 6); ctx.fill();
  ctx.fillStyle = `rgba(34,211,238,${glow * 0.7})`; roundRect(x - 10, GROUND - 42, 20, 40, 5); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, GROUND - h - 4); ctx.lineTo(x, GROUND - h - 34); ctx.stroke();
  if (Math.sin(performance.now() / 300) > 0) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, GROUND - h - 36, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `${color}55`; ctx.beginPath(); ctx.arc(x, GROUND - h - 36, 8, 0, Math.PI * 2); ctx.fill();
  }
}
function drawCracks(x, w, h, amount) {
  const n = Math.max(1, Math.floor(amount * 6));
  ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1.5;
  for (let i = 0; i < n; i++) {
    const sx = x - w/2 + 8 + ((i * 37) % (w - 16));
    const sy = GROUND - h + 30 + ((i * 53) % (h - 40));
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 8, sy + 9); ctx.lineTo(sx + 3, sy + 18); ctx.lineTo(sx + 12, sy + 26); ctx.stroke();
  }
}

/* ===================== БАШНИ ===================== */
function drawTowers() {
  for (const t of G.towers) {
    const x = t.x, y = t.y;
    ctx.fillStyle = '#475569'; ctx.fillRect(x - 10, y - 60, 20, 60);
    ctx.fillStyle = '#94a3b8'; ctx.fillRect(x - 14, y - 70, 28, 12);
    ctx.strokeStyle = t.team === 'p' ? '#4ade80' : '#f87171'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y - 70); ctx.lineTo(x, y - 95); ctx.stroke();
    ctx.fillStyle = t.team === 'p' ? '#4ade80' : '#f87171';
    ctx.beginPath(); ctx.moveTo(x, y - 95); ctx.lineTo(x + 12, y - 89); ctx.lineTo(x, y - 83); ctx.closePath(); ctx.fill();
  }
}

/* ===================== ЮНИТЫ ===================== */
function drawUnit(u) {
  const dir = u.team === 'p' ? 1 : -1;
  const s = u.size;
  const x = u.x;
  const baseY = GROUND + u.yOff;
  const walk = u.anim;

  if (u.isBoss) {
    ctx.fillStyle = 'rgba(255,0,85,.15)';
    ctx.beginPath(); ctx.arc(x, baseY - 40, 50, 0, Math.PI * 2); ctx.fill();
  }

  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x, baseY + 2, 13 * s, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = u.team === 'p' ? 'rgba(74,222,128,.55)' : 'rgba(248,113,113,.55)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(x, baseY + 2, 11 * s, 3.2, 0, 0, Math.PI * 2); ctx.stroke();

  const bob = Math.sin(walk * 2) * 1.2 * s;
  drawLegs(x, baseY, s, walk, u);
  const bodyY = baseY - 16 * s + bob;
  drawBody(x, bodyY, s, u, dir);
  const headY = bodyY - 15 * s;
  drawHead(x, headY, s, u, dir);
  drawArmAndWeapon(x, bodyY, s, u, dir);

  if (u.hp < u.maxHp) {
    const bw = 30 * (u.isBoss ? 2 : 1), by = baseY - 82 * s;
    ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(x - bw/2, by, bw, 4);
    ctx.fillStyle = u.team === 'p' ? '#4ade80' : '#f87171'; ctx.fillRect(x - bw/2, by, bw * (u.hp / u.maxHp), 4);
  }

  if (u.flashTimer > 0) {
    ctx.fillStyle = `rgba(255, 255, 255, ${u.flashTimer * 4})`;
    ctx.beginPath();
    ctx.arc(x, baseY - 25 * s, 22 * s, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawLegs(x, baseY, s, walk, u) {
  const swing = Math.sin(walk) * 4 * s;
  const legColor = u.era === 3 ? '#0f172a' : u.era === 2 ? darken(u.color, 60) : '#3a2410';
  ctx.strokeStyle = legColor; ctx.lineWidth = 4 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - 3 * s, baseY - 16 * s); ctx.lineTo(x - 3 * s - swing, baseY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 3 * s, baseY - 16 * s); ctx.lineTo(x + 3 * s + swing, baseY); ctx.stroke();
}

function drawBody(x, y, s, u, dir) {
  const w = 15 * s, h = 20 * s;
  ctx.fillStyle = u.color; roundRect(x - w/2, y - h, w, h, 3 * s); ctx.fill();
  ctx.strokeStyle = u.team === 'p' ? 'rgba(74,222,128,.85)' : 'rgba(248,113,113,.85)'; ctx.lineWidth = 1.6; ctx.stroke();

  if (u.era === 0) {
    ctx.fillStyle = darken(u.color, 35); ctx.beginPath(); ctx.moveTo(x - w/2, y - h + 4 * s);
    for (let i = 0; i <= 6; i++) ctx.lineTo(x - w/2 + (w / 6) * i, y - h + (i % 2 ? -3 * s : 1.5 * s));
    ctx.lineTo(x + w/2, y - h + 4 * s); ctx.closePath(); ctx.fill();
  } else if (u.era === 1) {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x - w/2, y - 6 * s, w, 3 * s);
    ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(x, y - 4.5 * s, 2 * s, 0, Math.PI * 2); ctx.fill();
  } else if (u.era === 2) {
    ctx.fillStyle = 'rgba(255,255,255,.28)'; roundRect(x - w/2 + 2 * s, y - h + 4 * s, w - 4 * s, 7 * s, 2 * s); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(x - 1 * s, y - h + 4 * s, 2 * s, 10 * s); ctx.fillRect(x - 3 * s, y - h + 7 * s, 6 * s, 2 * s);
  } else {
    const glow = 0.5 + 0.5 * Math.sin(performance.now() / 280 + u.anim);
    ctx.fillStyle = u.team === 'p' ? `rgba(34,211,238,${glow})` : `rgba(248,113,113,${glow})`; ctx.beginPath(); ctx.arc(x, y - h / 2, 3.2 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${glow * 0.6})`; ctx.beginPath(); ctx.arc(x, y - h / 2, 1.4 * s, 0, Math.PI * 2); ctx.fill();
  }
}

function drawHead(x, y, s, u, dir) {
  const r = 7 * s;
  if (u.era === 2) {
    ctx.fillStyle = '#cbd5e1'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#0f172a'; ctx.fillRect(x + dir * 1 * s, y - 2 * s, dir * 5 * s, 3 * s);
    ctx.fillStyle = u.color; ctx.beginPath(); ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x - dir * 2 * s, y - r - 6 * s, x + dir * 2 * s, y - r - 4 * s); ctx.lineTo(x, y - r + 2 * s); ctx.closePath(); ctx.fill();
  } else if (u.era === 3) {
    ctx.fillStyle = '#0f172a'; roundRect(x - r, y - r, r * 2, r * 2, 3 * s); ctx.fill();
    ctx.strokeStyle = u.team === 'p' ? '#4ade80' : '#f87171'; ctx.lineWidth = 1.2; ctx.stroke();
    const glow = 0.6 + 0.4 * Math.sin(performance.now() / 180);
    ctx.fillStyle = u.team === 'p' ? `rgba(34,211,238,${glow})` : `rgba(248,113,113,${glow})`; ctx.fillRect(x + dir * 1 * s, y - 2 * s, 4.5 * s, 2.5 * s);
    ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + dir * 2 * s, y - r - 5 * s); ctx.stroke();
  } else {
    ctx.fillStyle = u.era === 0 ? '#e8b885' : '#f4c99b'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; ctx.stroke();
    if (u.era === 0) {
      ctx.fillStyle = '#5d3a12'; ctx.beginPath(); ctx.arc(x, y - 1 * s, r + 1, Math.PI, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x, y + 3 * s, r * 0.7, 0, Math.PI); ctx.fill();
    } else {
      ctx.fillStyle = u.color; ctx.beginPath(); ctx.arc(x, y - 1 * s, r + 0.5, Math.PI, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(x + dir * 3 * s, y - 1 * s, 1.2 * s, 0, Math.PI * 2); ctx.fill();
  }
}

function drawArmAndWeapon(x, bodyY, s, u, dir) {
  const lunge = u.attackAnim * 4 * s;
  const shoulderX = x + dir * 4 * s, shoulderY = bodyY - 14 * s;
  const handX = x + dir * (7 * s + lunge), handY = bodyY - 10 * s;

  ctx.strokeStyle = u.era === 3 ? '#475569' : u.era === 2 ? '#94a3b8' : '#d4a373';
  ctx.lineWidth = 3 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(shoulderX, shoulderY); ctx.lineTo(handX, handY); ctx.stroke();

  ctx.save(); ctx.translate(handX, handY); ctx.scale(dir, 1); ctx.rotate(-u.attackAnim * 0.85);

  if (u.type === 3) {
    if (u.era === 0) drawClub(s); else if (u.era === 1) drawSword(s); else if (u.era === 2) drawPike(s); else drawBigCannon(s);
  } else {
    if (u.era === 0) {
      if (u.type === 0) drawClub(s); else if (u.type === 1) drawStoneSpear(s); else drawSling(s);
    } else if (u.era === 1) {
      if (u.type === 0) drawSword(s); else if (u.type === 1) drawLongSpear(s); else drawBow(s);
    } else if (u.era === 2) {
      if (u.type === 0) drawSword(s); else if (u.type === 1) drawPike(s); else drawCrossbow(s);
    } else {
      if (u.type === 0) drawLaserPistol(s); else if (u.type === 1) drawCannonArm(s); else drawBigCannon(s);
    }
  }
  ctx.restore();
}

function drawClub(s) { ctx.strokeStyle = '#78350f'; ctx.lineWidth = 3 * s; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(14 * s, -2 * s); ctx.stroke(); ctx.fillStyle = '#451a03'; ctx.beginPath(); ctx.ellipse(18 * s, -3 * s, 6 * s, 5 * s, 0, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#78350f'; ctx.beginPath(); ctx.arc(16 * s, -6 * s, 1.8 * s, 0, Math.PI * 2); ctx.arc(20 * s, 0, 1.8 * s, 0, Math.PI * 2); ctx.fill(); }
function drawStoneSpear(s) { ctx.strokeStyle = '#78350f'; ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.moveTo(-5 * s, 0); ctx.lineTo(30 * s, 0); ctx.stroke(); ctx.fillStyle = '#a8a29e'; ctx.beginPath(); ctx.moveTo(30 * s, -3 * s); ctx.lineTo(37 * s, 0); ctx.lineTo(30 * s, 3 * s); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#451a03'; ctx.fillRect(28 * s, -1.5 * s, 3 * s, 3 * s); }
function drawSling(s) { ctx.strokeStyle = '#78350f'; ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(6 * s, 4 * s); ctx.stroke(); ctx.strokeStyle = '#d6b48a'; ctx.lineWidth = 1.2 * s; ctx.beginPath(); ctx.moveTo(6 * s, 4 * s); ctx.quadraticCurveTo(14 * s, 10 * s, 16 * s, 0); ctx.stroke(); ctx.fillStyle = '#a8a29e'; ctx.beginPath(); ctx.arc(16 * s, 0, 2.4 * s, 0, Math.PI * 2); ctx.fill(); }
function drawSword(s) { ctx.strokeStyle = '#78350f'; ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(4 * s, 0); ctx.stroke(); ctx.fillStyle = '#fbbf24'; ctx.fillRect(4 * s, -3 * s, 2 * s, 6 * s); const grad = ctx.createLinearGradient(6 * s, 0, 26 * s, 0); grad.addColorStop(0, '#e5e7eb'); grad.addColorStop(1, '#94a3b8'); ctx.fillStyle = grad; ctx.beginPath(); ctx.moveTo(6 * s, -2 * s); ctx.lineTo(22 * s, -1.5 * s); ctx.lineTo(26 * s, 0); ctx.lineTo(22 * s, 1.5 * s); ctx.lineTo(6 * s, 2 * s); ctx.closePath(); ctx.fill(); }
function drawLongSpear(s) { ctx.strokeStyle = '#78350f'; ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.moveTo(-10 * s, 0); ctx.lineTo(38 * s, 0); ctx.stroke(); ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.moveTo(38 * s, -3 * s); ctx.lineTo(46 * s, 0); ctx.lineTo(38 * s, 3 * s); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#451a03'; ctx.fillRect(35 * s, -1.5 * s, 4 * s, 3 * s); }
function drawBow(s) { ctx.strokeStyle = '#78350f'; ctx.lineWidth = 2.5 * s; ctx.beginPath(); ctx.arc(2 * s, 0, 12 * s, -Math.PI / 2.2, Math.PI / 2.2); ctx.stroke(); ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1 * s; const ax = 2 * s + 12 * s * Math.cos(-Math.PI / 2.2), ay = 12 * s * Math.sin(-Math.PI / 2.2); const bx = 2 * s + 12 * s * Math.cos(Math.PI / 2.2), by = 12 * s * Math.sin(Math.PI / 2.2); ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); ctx.strokeStyle = '#a16207'; ctx.lineWidth = 1.5 * s; ctx.beginPath(); ctx.moveTo(-6 * s, 0); ctx.lineTo(10 * s, 0); ctx.stroke(); ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.moveTo(10 * s, -2 * s); ctx.lineTo(15 * s, 0); ctx.lineTo(10 * s, 2 * s); ctx.closePath(); ctx.fill(); }
function drawPike(s) { ctx.strokeStyle = '#451a03'; ctx.lineWidth = 2.2 * s; ctx.beginPath(); ctx.moveTo(-15 * s, 0); ctx.lineTo(44 * s, 0); ctx.stroke(); ctx.fillStyle = '#cbd5e1'; ctx.beginPath(); ctx.moveTo(44 * s, -3 * s); ctx.lineTo(54 * s, 0); ctx.lineTo(44 * s, 3 * s); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#fbbf24'; ctx.fillRect(42 * s, -3 * s, 2 * s, 6 * s); }
function drawCrossbow(s) { ctx.fillStyle = '#78350f'; ctx.fillRect(-2 * s, -2 * s, 18 * s, 4 * s); ctx.strokeStyle = '#451a03'; ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.arc(16 * s, 0, 10 * s, -Math.PI / 2.2, Math.PI / 2.2); ctx.stroke(); ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1 * s; const ax = 16 * s + 10 * s * Math.cos(-Math.PI / 2.2), ay = 10 * s * Math.sin(-Math.PI / 2.2); const bx = 16 * s + 10 * s * Math.cos(Math.PI / 2.2), by = 10 * s * Math.sin(Math.PI / 2.2); ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); ctx.strokeStyle = '#a16207'; ctx.lineWidth = 1.5 * s; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(16 * s, 0); ctx.stroke(); ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.moveTo(16 * s, -2 * s); ctx.lineTo(22 * s, 0); ctx.lineTo(16 * s, 2 * s); ctx.closePath(); ctx.fill(); }
function drawLaserPistol(s) { ctx.fillStyle = '#1e293b'; ctx.fillRect(-2 * s, -3 * s, 12 * s, 6 * s); ctx.fillStyle = '#334155'; ctx.fillRect(10 * s, -2 * s, 8 * s, 4 * s); const glow = 0.5 + 0.5 * Math.sin(performance.now() / 150); ctx.fillStyle = `rgba(34,211,238,${glow})`; ctx.beginPath(); ctx.arc(18 * s, 0, 3 * s, 0, Math.PI * 2); ctx.fill(); }
function drawCannonArm(s) { ctx.fillStyle = '#475569'; ctx.fillRect(-3 * s, -6 * s, 16 * s, 12 * s); ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(13 * s, 0, 5 * s, 0, Math.PI * 2); ctx.fill(); const glow = 0.5 + 0.5 * Math.sin(performance.now() / 200); ctx.fillStyle = `rgba(168,85,247,${glow})`; ctx.beginPath(); ctx.arc(13 * s, 0, 3 * s, 0, Math.PI * 2); ctx.fill(); }
function drawBigCannon(s) { ctx.fillStyle = '#334155'; ctx.fillRect(-4 * s, -5 * s, 14 * s, 10 * s); ctx.fillStyle = '#64748b'; ctx.fillRect(10 * s, -3 * s, 20 * s, 6 * s); ctx.fillStyle = '#1e293b'; ctx.fillRect(16 * s, -4 * s, 2 * s, 8 * s); ctx.fillRect(24 * s, -4 * s, 2 * s, 8 * s); const glow = 0.5 + 0.5 * Math.sin(performance.now() / 150); ctx.fillStyle = `rgba(244,63,94,${glow})`; ctx.beginPath(); ctx.arc(30 * s, 0, 3 * s, 0, Math.PI * 2); ctx.fill(); }

/* ===================== ГЛАВНЫЙ РЕНДЕР ===================== */
function draw() {
  ctx.save();
  if (G.shakeIntensity > 0) {
    ctx.translate((Math.random() - 0.5) * G.shakeIntensity, (Math.random() - 0.5) * G.shakeIntensity);
  }

  drawBackground();
  drawTowers();
  drawBase(G.playerBaseX, G.playerBaseHp, G.playerBaseMax, 'p');
  drawBase(G.enemyBaseX, G.enemyBaseHp, G.enemyBaseMax, 'e');

  const sorted = [...G.units].sort((a, b) => a.yOff - b.yOff);
  for (const u of sorted) drawUnit(u);

  for (const p of G.particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  for (const f of G.floats) {
    const a = Math.max(0, f.life);
    ctx.globalAlpha = a;
    ctx.font = `bold ${f.size}px system-ui, sans-serif`;
    ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 3.5;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';

  const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W, H) * 0.4, W/2, H/2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.35)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  ctx.restore();
  
  if (G.flash > 0) {
    ctx.fillStyle = `rgba(255,255,220,${G.flash})`;
    ctx.fillRect(0, 0, W, H);
  }
  
  if (G.bossAnnounce > 0) {
    const alpha = Math.min(1, G.bossAnnounce * 1.5);
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.font = 'bold 42px system-ui, sans-serif';
    ctx.fillStyle = '#ff0055';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
    ctx.strokeText('БОСС!', W/2, 180);
    ctx.fillText('БОСС!', W/2, 180);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }
}

/* ===================== HUD ===================== */
function buildButtons() {
  unitButtons.innerHTML = '';
  ERAS[G.era].units.forEach((u, i) => {
    const b = document.createElement('button');
    b.className = 'unit-btn';
    const lvlBonus = 1 + (G.unitLevels[i] - 1) * 0.25;
    b.innerHTML = `
      <span class="lvl">Lv.${G.unitLevels[i]}</span>
      <span class="name">${i + 1}. ${u.name}</span>
      <span class="cost">🥩 ${u.cost}</span>
      <span class="dps">❤ ${Math.round(u.hp * lvlBonus * G.buffMults.hp * getMetaMult('unitHp'))} · ⚔ ${Math.round(u.dmg * lvlBonus * G.buffMults.dmg * getMetaMult('unitDmg'))}</span>
    `;
    b.addEventListener('click', () => trySpawn(i));
    unitButtons.appendChild(b);
  });
}

function syncHUD() {
  if (lastHUD.coins !== G.coins) { coinsEl.textContent = G.coins; lastHUD.coins = G.coins; }
  const waveStr = `Ур.${G.level} · Волна ${G.wave}${G.wave % 3 === 0 ? ' 👹' : ''}`;
  if (lastHUD.wave !== waveStr) { waveLabel.textContent = waveStr; lastHUD.wave = waveStr; }
  
  hpPEl.style.width = Math.max(0, G.playerBaseHp / G.playerBaseMax * 100) + '%';
  hpEEl.style.width = Math.max(0, G.enemyBaseHp / G.enemyBaseMax * 100) + '%';
  meatFill.style.width = (G.meat / G.meatMax * 100) + '%';
  meatText.textContent = `🥩 ${Math.floor(G.meat)} / ${G.meatMax}`;

  btnTower.querySelector('.cost').textContent = `💰 ${G.towerPrice}`;
  btnTower.disabled = !G.running || G.coins < G.towerPrice || G.towers.filter(t => t.team === 'p').length >= 3;

  btnUpgrade.querySelector('.cost').textContent = `💰 ${G.upgradePrice}`;
  btnUpgrade.disabled = !G.running || G.coins < G.upgradePrice;

  const defs = ERAS[G.era].units;
  for (let i = 0; i < unitButtons.children.length; i++) {
    unitButtons.children[i].disabled = !G.running || G.meat < defs[i].cost;
  }

  cannonFill.style.width = (G.cannonCharge / G.cannonMax * 100) + '%';
  if (G.cannonCharge >= G.cannonMax) {
    cannonBar.classList.add('ready');
    cannonText.textContent = '⚡ НАЖМИ ДЛЯ ВЫСТРЕЛА!';
    cannonText.style.color = '#fde047';
  } else {
    cannonBar.classList.remove('ready');
    cannonText.textContent = `⚡ ЗАРЯД ${Math.floor(G.cannonCharge / G.cannonMax * 100)}%`;
    cannonText.style.color = '#fff';
  }
}

/* ===================== ЭКРАНЫ ===================== */
function showOverlay(html, screen) { overlay.innerHTML = html; overlay.dataset.screen = screen || ''; overlay.classList.add('show'); }
function hideOverlay() { overlay.classList.remove('show'); overlay.dataset.screen = ''; }

function showStart() {
  G.coins = 0; G.era = 0; G.level = 1;
  G.unitLevels = [1, 1, 1, 1]; G.upgradePrice = 100;
  G.meta = { baseHp:0, meatRegen:0, unitDmg:0, unitHp:0, cannonDmg:0 };
  G.playerBaseHp = 1000; G.enemyBaseHp = 0; G.playerBaseMax = 1000; G.enemyBaseMax = 900;
  G.units = []; G.floats = []; G.particles = []; G.towers = []; G.running = false;
  G.wave = 1; G.maxWaveReached = 1; G.buffs = []; G.buffMults = { dmg:1, hp:1, towerDmg:1, regen:1, cannon:1, vamp:false, crit:0, speed:1 };
  G.cannonCharge = 0; G.towerPrice = 150;
  bossBar.classList.remove('show');
  buildButtons();

  showOverlay(`
    <h1>ВОЙНУШКА</h1>
    <p>Веди армию сквозь века. Заряжай пушку, побеждай боссов и забирай их силу!</p>
    <input type="text" id="playerNameInput" class="name-input" placeholder="Введите ваше имя" value="${playerName}">
    <p style="font-size:12px;color:#7a7a8a; margin-bottom: 5px;"><b>1/2/3/4</b> — юниты · <b>Q</b> — пушка · <b>E</b> — башня · <b>R</b> — прокачка</p>
    <div>
      <button class="btn" data-action="start">В бой!</button>
      <button class="btn sec" data-action="leaderboard">🏆 Рекорды</button>
    </div>
  `, 'start');

  // Обработчик ввода имени
  document.getElementById('playerNameInput').addEventListener('input', (e) => {
    playerName = e.target.value.trim();
    localStorage.setItem('war_player_name', playerName);
  });
}

async function showLeaderboard() {
  if (!supabaseClient) {
    showOverlay(`
      <h1>🏆 Таблица лидеров</h1>
      <p style="color: #f87171;">База данных не подключена!<br>Проверьте настройки Supabase.</p>
      <button class="btn sec" data-action="backToStart">Назад</button>
    `, 'leaderboard');
    return;
  }

  showOverlay(`
    <h1>🏆 Таблица лидеров</h1>
    <p>Загрузка данных...</p>
    <button class="btn sec" data-action="backToStart">Назад</button>
  `, 'leaderboard');

  try {
    const { data, error } = await supabaseClient
      .from('players')
      .select('name, level, wave')
      .order('level', { ascending: false })
      .order('wave', { ascending: false })
      .limit(10);

    if (error) throw error;

    let rows = '';
    if (data && data.length > 0) {
      data.forEach((p, index) => {
        let rankClass = '';
        if (index === 0) rankClass = 'top1';
        else if (index === 1) rankClass = 'top2';
        else if (index === 2) rankClass = 'top3';

        rows += `
          <tr class="${rankClass}">
            <td>${index + 1}</td>
            <td>${p.name || 'Безымянный'}</td>
            <td>Уровень ${p.level}</td>
            <td>Волна ${p.wave}</td>
          </tr>
        `;
      });
    } else {
      rows = `<tr><td colspan="4" style="text-align:center;">Пока нет рекордов. Будьте первым!</td></tr>`;
    }

    showOverlay(`
      <h1>🏆 Таблица лидеров</h1>
      <p>Топ-10 игроков по пройденным волнам</p>
      <table class="lb-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Имя</th>
            <th>Уровень</th>
            <th>Волна</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      <button class="btn sec" data-action="backToStart">Назад</button>
    `, 'leaderboard');

  } catch (err) {
    console.error(err);
    showOverlay(`
      <h1>Ошибка</h1>
      <p style="color: #f87171;">Не удалось загрузить таблицу лидеров.<br>Убедитесь, что вы выполнили SQL-код в Supabase.</p>
      <button class="btn sec" data-action="backToStart">Назад</button>
    `, 'leaderboard');
  }
}

function startLevel() {
  if (!playerName) {
    alert('Пожалуйста, введите имя перед началом игры!');
    return;
  }
  hideOverlay();
  G.playerBaseMax = 1000 + G.meta.baseHp * 350;
  G.meatRegen = 12 + G.meta.meatRegen * 4 + G.level * 1.2;
  G.playerBaseHp = G.playerBaseMax;
  G.enemyBaseMax = (800 + G.level * 150) * Math.pow(1.3, G.level - 1);
  G.enemyBaseHp = G.enemyBaseMax;
  G.enemyMeatRegen = 10 + G.level * 2;
  G.meatMax = 200 + G.level * 30;
  G.meat = 100; G.enemyMeat = 60;
  G.units = []; G.floats = []; G.particles = []; G.towers = [];
  G.wave = 0; G.enemiesToSpawn = 0; G.bossUnit = null;
  G.cannonCharge = 0; G.shakeIntensity = 0; G.flash = 0; G.hitstop = 0;
  G.towerPrice = 150; G.upgradePrice = 100;
  G.aiTimer = 2.5; G.lastTime = 0; G.running = true;
  G.comboCount = 0; G.comboTimer = 0; G.wavePending = false;
  bossBar.classList.remove('show');
  
  startWave();
  buildButtons();
  saveProgress(); // Сохраняем при старте
}

function endBattle(win) {
  G.running = false;
  if (win) {
    Sound.win();
    const reward = 150 + G.level * 100;
    G.coins += reward;
    G.level++;
    G.era = Math.min(3, Math.floor((G.level - 1) / 2));
    buildButtons();
    saveProgress();
    showVictoryScreen(reward);
  } else {
    Sound.lose();
    saveProgress();
    showOverlay(`
      <h1 style="color:#f87171">ПОРАЖЕНИЕ</h1>
      <p>База пала, но ты получил <b>${G.coins} 💰</b> с убийств.<br>Потрать их на улучшения в магазине!</p>
      <button class="btn sec" data-action="shop">🛒 Магазин</button>
      <button class="btn warn" data-action="retryLevel">Переиграть уровень ${G.level}</button>
    `, 'defeat');
  }
}

function showVictoryScreen(reward) {
  showOverlay(`
    <h1>УРОВЕНЬ ${G.level - 1} ПРОЙДЕН!</h1>
    <p>+${reward} 💰 · Всего: <b>${G.coins} 💰</b></p>
    <p style="color:#f87171;font-size:13px">Враги на следующем уровне станут сильнее!</p>
    <button class="btn sec" data-action="shop">🛒 Магазин улучшений</button>
    <button class="btn" data-action="nextLevel">Уровень ${G.level} →</button>
  `, 'victory');
}

function showMetaShop() {
  const items = META_UPGRADES.map(u => {
    const lvl = G.meta[u.id] || 0;
    const cost = u.baseCost * Math.pow(2, lvl);
    const canBuy = G.coins >= cost;
    const maxed = lvl >= 8;
    const cls = maxed ? 'maxed' : (canBuy ? '' : 'cant');
    return `
      <div class="shop-item ${cls}" data-shop="${u.id}">
        <div class="ico">${u.icon}</div>
        <div class="nm">${u.name}</div>
        <div class="ds">${u.desc}</div>
        ${maxed 
          ? `<div class="lvl-badge">★ MAX (ур. ${lvl})</div>`
          : `<div class="pr">💰 ${cost}</div><div class="lvl-badge">ур. ${lvl}</div>`}
      </div>`;
  }).join('');
  
  showOverlay(`
    <h1>🛒 МАГАЗИН</h1>
    <p>Улучшения сохраняются между уровнями. Твой бюджет: <b style="color:#fbbf24">${G.coins} 💰</b></p>
    <div class="shop-grid">${items}</div>
    <button class="btn" data-action="${G.playerBaseHp > 0 ? 'nextLevel' : 'startLevel'}">${G.playerBaseHp > 0 ? 'Начать уровень ' + G.level + ' →' : 'В бой!'}</button>
  `, 'shop');
}

/* ===================== СОБЫТИЯ ===================== */
overlay.addEventListener('click', e => {
  Sound.init();
  const btn = e.target.closest('[data-action], [data-buff], [data-shop]');
  if (!btn) return;
  Sound.click();
  
  if (btn.dataset.buff) {
    const buff = BUFFS.find(b => b.id === btn.dataset.buff);
    if (buff) {
      G.buffs.push(buff);
      recalcBuffs();
      G.running = true;
      hideOverlay();
      startWave();
      buildButtons();
    }
    return;
  }
  
  if (btn.dataset.shop) {
    const id = btn.dataset.shop;
    const u = META_UPGRADES.find(x => x.id === id);
    const lvl = G.meta[id] || 0;
    const cost = u.baseCost * Math.pow(2, lvl);
    if (lvl < 8 && G.coins >= cost) {
      G.coins -= cost; G.meta[id] = lvl + 1;
      Sound.buff(); saveProgress(); showMetaShop();
    }
    return;
  }
  
  const a = btn.dataset.action;
  if (a === 'start' || a === 'startLevel') startLevel();
  else if (a === 'nextLevel') startLevel();
  else if (a === 'retryLevel') startLevel();
  else if (a === 'shop') showMetaShop();
  else if (a === 'restart') showStart();
  else if (a === 'leaderboard') showLeaderboard();
  else if (a === 'backToStart') showStart();
});

document.addEventListener('keydown', e => {
  if (e.repeat) return;
  Sound.init();
  if (document.activeElement.tagName === 'INPUT') return; // Чтобы не спавнить юнитов при вводе имени
  if (e.key === '1') trySpawn(0);
  if (e.key === '2') trySpawn(1);
  if (e.key === '3') trySpawn(2);
  if (e.key === '4') trySpawn(3);
  if (e.key === 'q' || e.key === 'Q' || e.key === 'й' || e.key === 'Й') fireCannon();
  if (e.key === 'e' || e.key === 'E' || e.key === 'у' || e.key === 'У') buildTower();
  if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') upgradeUnits();
});

btnTower.addEventListener('click', () => { Sound.init(); buildTower(); });
btnUpgrade.addEventListener('click', () => { Sound.init(); upgradeUnits(); });
cannonBar.addEventListener('click', () => { Sound.init(); fireCannon(); });
document.addEventListener('click', () => Sound.init(), { once: true });

/* ===================== LOOP ===================== */
function loop(t) {
  if (!G.lastTime) G.lastTime = t;
  let dt = (t - G.lastTime) / 1000;
  G.lastTime = t;
  dt = Math.min(dt, 0.05);

  if (G.running) update(dt);
  draw();
  syncHUD();
  requestAnimationFrame(loop);
}

loadProgress();
buildButtons();
showStart();
requestAnimationFrame(loop);
</script>
</body>
</html>
